name: iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      target:
        description: "What to build"
        type: choice
        options:
          - device
          - simulator
          - both
        default: device
  push:
    tags:
      - "ios-*"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.configuration || 'Release' }}-${{ inputs.target || 'device' }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS ${{ inputs.target || 'device' }} ${{ inputs.configuration || 'Release' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CONFIG: ${{ inputs.configuration || 'Release' }}
      TARGET: ${{ inputs.target || 'device' }}
      PRODUCT_NAME: Kotlin Night Funkin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: |
          # Kotlin/Native 2.0.20 (bundled with KorGE 6.0.0) officially supports
          # the Xcode 16.0 SDK, so pin it instead of the runner default.
          sudo xcode-select -s /Applications/Xcode_16.0.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.0.20
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: |
          # The KorGE plugin looks for /usr/local/bin/xcodegen or its own
          # ~/.korge checkout. Symlink the Homebrew binary to both so it
          # never tries to clone and build XcodeGen from source.
          brew install xcodegen
          XCODEGEN="$(command -v xcodegen)"
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$XCODEGEN" /usr/local/bin/xcodegen
          mkdir -p "$HOME/.korge/XcodeGen-2.42.0/.build/release"
          ln -sf "$XCODEGEN" "$HOME/.korge/XcodeGen-2.42.0/.build/release/xcodegen"
          xcodegen --version

      - name: Build device app (unsigned)
        if: env.TARGET == 'device' || env.TARGET == 'both'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -Pknf.ios.unsigned=true "iosBuildDevice${CONFIG}"

      - name: Package unsigned IPA
        if: env.TARGET == 'device' || env.TARGET == 'both'
        run: |
          set -euo pipefail
          APP="build/platforms/ios/app.xcodeproj/build/Build/Products/${CONFIG}-iphoneos/${PRODUCT_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app not found at $APP"
            find build/platforms/ios -name "*.app" -maxdepth 8 || true
            exit 1
          fi
          rm -rf build/dist
          mkdir -p build/dist/Payload
          cp -R "$APP" build/dist/Payload/
          # -y keeps the symlinks inside embedded frameworks intact.
          (cd build/dist && zip -qry "KotlinNightFunkin-${CONFIG}.ipa" Payload)
          rm -rf build/dist/Payload
          ls -lh build/dist

      - name: Build simulator app
        if: env.TARGET == 'simulator' || env.TARGET == 'both'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -Pknf.ios.unsigned=true "iosBuildSimulator${CONFIG}"

      - name: Package simulator app
        if: env.TARGET == 'simulator' || env.TARGET == 'both'
        run: |
          set -euo pipefail
          APP="build/platforms/ios/app.xcodeproj/build/Build/Products/${CONFIG}-iphonesimulator/${PRODUCT_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app not found at $APP"
            find build/platforms/ios -name "*.app" -maxdepth 8 || true
            exit 1
          fi
          mkdir -p build/dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "build/dist/KotlinNightFunkin-${CONFIG}-Simulator.zip"
          ls -lh build/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KotlinNightFunkin-iOS-${{ env.CONFIG }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kotlin Night Funkin — iOS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Configuration | \`${CONFIG}\` |"
            echo "| Target | \`${TARGET}\` |"
            echo "| Signing | unsigned |"
            echo ""
            if [ "$TARGET" = "device" ] || [ "$TARGET" = "both" ]; then
              echo "The \`.ipa\` is **unsigned**. Install it with Sideloadly / AltStore / TrollStore,"
              echo "which will re-sign it with your own Apple ID. A free Apple ID works (7-day signature)."
            fi
            if [ "$TARGET" = "simulator" ] || [ "$TARGET" = "both" ]; then
              echo ""
              echo "The simulator \`.zip\` contains an arm64 \`.app\`; unzip it and drag it into an iOS Simulator."
            fi
            echo ""
            echo "After launching, copy the FNF \`assets\` folder into the app's Documents folder"
            echo "(\`Files ▸ On My iPhone ▸ Kotlin Night Funkin ▸ KNF/assets\`)."
          } >> "$GITHUB_STEP_SUMMARY"
