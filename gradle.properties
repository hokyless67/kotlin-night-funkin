org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# korlibs/korge builds its own source-set hierarchy via dependsOn edges, so the
# default template is intentionally unused.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Kotlin/Native iOS cross-compilation works fine on this machine despite the
# default host check disabling the targets.
kotlin.native.ignoreDisabledTargets=true
